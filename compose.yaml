services:
  postgres:
    image: postgres:16
    container_name: capstone-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: capstone_db
      POSTGRES_USER: capstone_user
      POSTGRES_PASSWORD: capstone_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - capstone_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone_user -d capstone_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  capstone_pgdata: