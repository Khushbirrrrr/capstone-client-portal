<div class="login-container">
  <div class="login-card">
    <h1>Capstone Client Portal</h1>
    <p class="subtitle">Sheridan College</p>

    <h2>Sign In</h2>
    <p>Enter your Sheridan credentials to continue.</p>

   <form (ngSubmit)="onLogin()">
  <label for="email">Sheridan Email</label>
  <input
    id="email"
    type="email"
    name="email"
    [(ngModel)]="email"
    required
  />

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    name="password"
    [(ngModel)]="password"
    required
  />

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <button type="submit" [disabled]="isLoading">
    {{ isLoading ? 'Signing In...' : 'Sign In' }}
  </button>
</form>


  </div>
</div>
