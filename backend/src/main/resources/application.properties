spring.application.name=clientportal
server.port=${PORT:8080}

# Never hardcode database passwords into a committed project.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/capstone_db}
spring.datasource.username=${DB_USERNAME:capstone_user}
spring.datasource.password=${DB_PASSWORD}

# For local development; use formal migrations and HTTPS in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

portal.default-term=${PORTAL_DEFAULT_TERM:Fall 2026}
portal.demo.seed=${PORTAL_DEMO_SEED:false}
portal.demo.student-username=${PORTAL_DEMO_STUDENT_USERNAME:}
portal.demo.student-password=${PORTAL_DEMO_STUDENT_PASSWORD:}
portal.demo.faculty-username=${PORTAL_DEMO_FACULTY_USERNAME:}
portal.demo.faculty-password=${PORTAL_DEMO_FACULTY_PASSWORD:}
