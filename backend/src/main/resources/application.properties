spring.application.name=clientportal

server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/capstone_db
spring.datasource.username=${DB_USERNAME:capstone_user}
spring.datasource.password=${DB_PASSWORD:capstone_dev_password}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development only
spring.jpa.open-in-view=false