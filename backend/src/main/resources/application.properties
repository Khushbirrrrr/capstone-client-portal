spring.application.name=capstone-client-portal
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/capstone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:capstone}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_local_only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
